<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="線盒">
<meta name="theme-color" content="#E8E4E0">
<title>線盒 · 繡線庫存</title>
<style>
:root{
  --bg:#E8E4E0; --surface:#F7F5F2; --card:#FFFFFF;
  --ink:#3E3936; --ink-soft:#6B635C; --muted:#9A9189;
  --line:#DBD5CE; --line-soft:#EAE5E0;
  --sage:#849181; --sage-deep:#65725F; --sage-pale:#DFE4DA;
  --clay:#B08878; --clay-pale:#EEDFD8;
  --dusk:#8A8798;
  --r-lg:22px; --r-md:16px; --r-sm:11px;
  --shadow:0 1px 2px rgba(62,57,54,.05), 0 6px 18px rgba(62,57,54,.06);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background-color:#E8E4E0}
html,body{margin:0;padding:0}
body::before{
  content:"";position:fixed;top:-10vh;left:0;right:0;bottom:-10vh;
  background-color:#E8E4E0;z-index:-1;pointer-events:none;
}
body{
  background:var(--bg); color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;
  font-size:15px; line-height:1.55;
  padding-bottom:calc(84px + env(safe-area-inset-bottom));
  -webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit;border:none;background:none;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}

.wrap{max-width:880px;margin:0 auto;padding:0 14px}

/* ---------- 頂部 ---------- */
header{padding:calc(14px + env(safe-area-inset-top)) 0 6px}
.brand{display:flex;align-items:baseline;gap:9px}
.brand h1{margin:0;font-size:21px;font-weight:650;letter-spacing:.04em}
.brand span{font-size:12.5px;color:var(--muted)}

.kinds{display:flex;gap:6px;margin:13px 0 10px;background:var(--line-soft);padding:4px;border-radius:var(--r-md)}
.kinds button{flex:1;padding:8px 4px;border-radius:12px;font-size:13.5px;color:var(--ink-soft);transition:background .15s,color .15s}
.kinds button[aria-selected="true"]{background:var(--card);color:var(--ink);font-weight:600;box-shadow:0 1px 3px rgba(62,57,54,.08)}

.searchrow{display:flex;gap:8px;align-items:center}
.search{flex:1;position:relative}
.search input{
  width:100%;padding:11px 36px 11px 14px;border-radius:var(--r-md);
  border:1px solid var(--line);background:var(--card);font-size:16px;outline:none;
}
.search input:focus{border-color:var(--sage)}
.search .clr{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:26px;height:26px;border-radius:50%;color:var(--muted);font-size:15px}

.chips{display:flex;gap:6px;overflow-x:auto;padding:11px 0 3px;margin:0 -14px;padding-left:14px;padding-right:14px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{
  flex:0 0 auto;padding:6px 13px;border-radius:999px;border:1px solid var(--line);
  background:var(--surface);font-size:13px;color:var(--ink-soft);display:flex;align-items:center;gap:6px;
  transition:background .15s,border-color .15s,color .15s;
}
.chip[aria-pressed="true"]{background:var(--sage);border-color:var(--sage);color:#fff}
.chip .dot{width:10px;height:10px;border-radius:50%;border:1px solid rgba(0,0,0,.12)}
.chip[aria-pressed="true"] .dot{border-color:rgba(255,255,255,.5)}

.count{padding:12px 2px 8px;font-size:12.5px;color:var(--muted);display:flex;justify-content:space-between;align-items:center}
.count button{font-size:12.5px;color:var(--sage-deep);text-decoration:underline;text-underline-offset:3px}

/* ---------- 色卡（整張淡底＋色票） ---------- */
.capgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;padding-bottom:8px}
.cap{
  display:flex;align-items:center;gap:10px;min-height:70px;
  padding:10px 11px;border-radius:15px;text-align:left;
  box-shadow:0 1px 2px rgba(88,82,77,.09), 0 3px 7px rgba(88,82,77,.08), 0 9px 20px rgba(88,82,77,.09);
  transition:transform .12s, box-shadow .12s;
}
.cap:active{transform:scale(.96);box-shadow:0 1px 3px rgba(88,82,77,.12)}
.cap .chip{
  flex:0 0 auto;width:46px;height:46px;border-radius:13px;
  display:grid;place-items:center;font-size:19px;font-weight:650;
  border:1px solid rgba(0,0,0,.13);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.35);
}
.cap .chip em{font-style:normal}
.cap .chip.zero em{opacity:.42;font-weight:500}
.cap .body{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.cap .body b{
  font-size:16px;font-weight:650;letter-spacing:.01em;line-height:1.15;color:#3E3936;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.cap .tags{display:flex;flex-wrap:wrap;gap:3px}
.cap .tags i{
  font-style:normal;font-size:10px;font-weight:650;line-height:1;
  padding:3px 5px;border-radius:5px;background:rgba(255,255,255,.62);color:rgba(62,57,54,.68);
}
.cap .tags i.low{background:rgba(190,120,60,.18);color:#8A5320}
.cap .tags i.none{background:none;color:rgba(62,57,54,.3);padding-left:1px}
@media (min-width:540px){
  .capgrid{grid-template-columns:repeat(3,1fr);gap:10px}
  .cap{min-height:76px;padding:11px 12px}
  .cap .chip{width:50px;height:50px;font-size:20px}
  .pickgrid{grid-template-columns:repeat(8,1fr)}
}
@media (min-width:800px){
  .capgrid{grid-template-columns:repeat(4,1fr)}
  .cap .body b{font-size:17px}
}


/* ---------- 作品配色 ---------- */
.projcard{display:flex;align-items:center;gap:11px;padding:11px 0;border-bottom:1px solid var(--line-soft);width:100%;text-align:left}
.projcard:last-of-type{border-bottom:none}
.projcard .mini{display:flex;flex:0 0 auto;border-radius:8px;overflow:hidden;box-shadow:0 1px 3px rgba(88,82,77,.16)}
.projcard .mini span{width:13px;height:36px}
.projcard .mini.none{width:52px;height:36px;background:var(--line-soft)}
.projcard .txt{flex:1;min-width:0}
.projcard .txt b{display:block;font-size:15px;font-weight:620;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.projcard .txt small{color:var(--muted);font-size:12px}
.projcard .go{color:var(--muted);font-size:17px;flex:0 0 auto}

.pbar{display:flex;align-items:center;justify-content:space-between;height:50px;border-radius:11px;padding:0 13px;margin-bottom:6px;width:100%;text-align:left;box-shadow:0 1px 3px rgba(88,82,77,.12)}
.pbar b{font-size:14px;font-weight:650;letter-spacing:.01em}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(74px,1fr));gap:8px}
.pcell{aspect-ratio:1;border-radius:13px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:7px;gap:3px;box-shadow:0 1px 3px rgba(88,82,77,.12)}
.pcell b,.pbar b{line-height:1.1}
.pcell b{font-size:12.5px;font-weight:650}
.miss{font-size:10px;font-weight:700;padding:2px 5px;border-radius:5px;background:rgba(255,255,255,.75);color:#8A5320}
.pbar .miss{background:rgba(255,255,255,.72)}

.pickgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}
.pick{
  aspect-ratio:1;border-radius:11px;display:grid;place-items:center;
  font-size:10.5px;font-weight:650;border:1px solid rgba(0,0,0,.12);position:relative;
}
.pick.on{box-shadow:inset 0 0 0 3px rgba(255,255,255,.88), 0 0 0 2.5px var(--sage-deep)}
.crumb{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.crumb button{padding:7px 13px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-size:13px;color:var(--ink-soft)}
.crumb h2{margin:0;font-size:17px;font-weight:650;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.crumb.stick{
  position:sticky;top:0;z-index:6;background:var(--bg);
  margin:0 -14px 10px;padding:9px 14px;border-bottom:1px solid var(--line-soft);
}
.crumb .done{
  background:var(--sage);border-color:var(--sage);color:#fff;font-weight:650;
  padding:9px 18px;font-size:14px;box-shadow:0 2px 8px rgba(101,114,95,.28);
}

/* 作品的功能列 */
.ptools{display:flex;gap:7px;margin-bottom:10px;flex-wrap:wrap}
.ptools button{
  padding:9px 15px;border-radius:999px;background:var(--surface);
  border:1px solid var(--line);font-size:13.5px;color:var(--ink-soft);
}
.ptools button.main{background:var(--sage);border-color:var(--sage);color:#fff;font-weight:620}
.ptools button.danger{margin-left:auto;color:#A2666A;background:#F5E8E8;border-color:#E4CCCD}
.ptools button.wish{background:#EFEAD9;border-color:#E0D8BF;color:#7A6A3C;font-weight:600}
.ptools button.wish[disabled]{opacity:.6}
.tipline{font-size:11.5px;color:var(--muted);margin:0 2px 10px}
.pbar,.pcell{touch-action:manipulation}
.dragging{
  position:relative;z-index:5;
  transform:scale(1.07);
  box-shadow:0 10px 26px rgba(88,82,77,.34), 0 0 0 2.5px rgba(255,255,255,.85) !important;
}
.dragmode .pbar:not(.dragging),.dragmode .pcell:not(.dragging){opacity:.62}

.empty{text-align:center;padding:46px 20px;color:var(--muted);font-size:14px}
.empty b{display:block;color:var(--ink-soft);font-weight:600;margin-bottom:5px;font-size:15px}

/* ---------- 清單樣式（待買／設定） ---------- */
.panel{background:var(--card);border-radius:var(--r-lg);padding:16px;box-shadow:var(--shadow);margin-bottom:12px}
.panel h2{margin:0 0 4px;font-size:16px;font-weight:620}
.panel p{margin:0 0 12px;font-size:13px;color:var(--ink-soft);line-height:1.6}
.row{display:flex;align-items:center;gap:11px;padding:10px 0;border-bottom:1px solid var(--line-soft)}
.row:last-child{border-bottom:none}
.row .patch{width:38px;height:38px;border-radius:var(--r-sm);flex:0 0 auto;border:1px solid rgba(0,0,0,.07)}
.row .txt{flex:1;min-width:0}
.row .txt b{display:block;font-size:14.5px;font-weight:620}
.row .txt small{color:var(--muted);font-size:12px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .act{flex:0 0 auto;padding:8px 13px;border-radius:999px;background:var(--sage);color:#fff;font-size:12.5px;font-weight:650}
.qty{display:flex;align-items:center;gap:2px;flex:0 0 auto;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:2px}
.qty button{width:28px;height:28px;border-radius:50%;font-size:15px;color:var(--ink-soft);display:grid;place-items:center}
.qty button:active{background:var(--sage-pale)}
.qty span{min-width:26px;text-align:center;font-size:14px;font-weight:650}
.buylist{margin:0 0 14px;font-size:13.5px;line-height:1.9;color:var(--ink)}
.buylist b{font-weight:650}

.btn{display:block;width:100%;padding:12px;border-radius:var(--r-md);background:var(--sage);color:#fff;font-size:14.5px;font-weight:600;text-align:center;margin-top:8px}
.btn.ghost{background:var(--surface);color:var(--ink-soft);border:1px solid var(--line)}
.btn.warn{background:var(--clay-pale);color:#8A5B4A}
textarea{width:100%;min-height:110px;padding:11px;border-radius:var(--r-md);border:1px solid var(--line);background:var(--surface);font-size:16px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;resize:vertical;outline:none}
.field{margin-bottom:10px}
.field label{display:block;font-size:12.5px;color:var(--ink-soft);margin-bottom:5px}
.field input{width:100%;padding:10px 12px;border-radius:var(--r-md);border:1px solid var(--line);background:var(--surface);font-size:16px;outline:none}
.field input[type=color]{height:46px;padding:4px}

/* ---------- 底部導覽 ---------- */
nav{
  position:fixed;left:0;right:0;bottom:0;z-index:40;
  background:rgba(247,245,242,.92);backdrop-filter:blur(14px);
  border-top:1px solid var(--line);
  padding:7px 0 calc(7px + env(safe-area-inset-bottom));
}
nav .wrap{display:flex}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px 0;color:var(--muted);font-size:11px;position:relative}
nav button[aria-selected="true"]{color:var(--sage-deep);font-weight:620}
nav svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
nav .badge{
  position:absolute;top:0;left:calc(50% + 8px);min-width:16px;height:16px;padding:0 4px;
  border-radius:999px;background:var(--clay);color:#fff;font-size:10px;font-weight:700;
  display:grid;place-items:center;
}

/* ---------- 詳細面板 ---------- */
.scrim{position:fixed;inset:0;background:rgba(48,44,41,.34);z-index:50;opacity:0;pointer-events:none;transition:opacity .22s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:51;
  background:var(--surface);border-radius:26px 26px 0 0;
  transform:translateY(101%);transition:transform .28s cubic-bezier(.32,.72,0,1);
  max-height:88vh;overflow-y:auto;box-shadow:0 -8px 32px rgba(62,57,54,.16);
}
.sheet.on{transform:translateY(0)}
.sheet .inner{max-width:680px;margin:0 auto;padding:0 18px calc(26px + env(safe-area-inset-bottom))}
.hero{display:flex;gap:14px;align-items:center;padding:4px 0 16px}
.hero .patch{width:78px;height:78px;border-radius:20px;flex:0 0 auto;border:1px solid rgba(0,0,0,.08);box-shadow:inset 0 0 0 4px rgba(255,255,255,.28)}
.hero .t b{display:block;font-size:26px;font-weight:650;letter-spacing:.01em;line-height:1.15}
.hero .t small{color:var(--ink-soft);font-size:13px;display:block;margin-top:3px}
.hero .t em{font-style:normal;font-size:11.5px;color:var(--muted);display:block;margin-top:5px;letter-spacing:.06em}

.block{background:var(--card);border-radius:var(--r-lg);padding:14px 15px;margin-bottom:11px}
.block .lab{font-size:12.5px;color:var(--ink-soft);margin-bottom:9px}
.stepper{display:flex;align-items:center;gap:14px}
.stepper button{width:42px;height:42px;border-radius:14px;background:var(--surface);border:1px solid var(--line);font-size:19px;color:var(--ink-soft);display:grid;place-items:center}
.stepper button:active{background:var(--sage-pale)}
.stepper .n{flex:1;text-align:center;font-size:26px;font-weight:650}
.stepper .n span{font-size:13px;font-weight:400;color:var(--muted);margin-left:3px}

.seg{display:flex;gap:6px}
.seg button{flex:1;padding:10px 4px;border-radius:13px;background:var(--surface);border:1px solid var(--line);font-size:13px;color:var(--ink-soft)}
.seg button[aria-pressed="true"]{background:var(--sage);border-color:var(--sage);color:#fff;font-weight:600}

.toggles{display:flex;gap:9px}
.toggles button{
  flex:1;padding:13px 6px;border-radius:var(--r-md);background:var(--surface);
  border:1px solid var(--line);font-size:13.5px;color:var(--ink-soft);
  display:flex;flex-direction:column;align-items:center;gap:4px;
}
.toggles button b{font-size:13.5px;font-weight:600;text-align:center}
.toggles button small{font-size:11px;color:var(--muted)}
.toggles button[aria-pressed="true"]{background:var(--dusk);border-color:var(--dusk);color:#fff}
.toggles button[aria-pressed="true"] small{color:rgba(255,255,255,.72)}
.toggles button.wish[aria-pressed="true"]{background:var(--clay);border-color:var(--clay)}
.toggles button.scrap[aria-pressed="true"]{background:#8F9BA6;border-color:#8F9BA6}
.note{width:100%;min-height:56px;padding:11px;border-radius:var(--r-md);border:1px solid var(--line);background:var(--surface);font-size:14px;resize:vertical;outline:none;font-family:inherit}


/* ---------- 浮動視窗頂部 ---------- */
.sheethead{
  position:sticky;top:0;z-index:2;display:flex;align-items:center;justify-content:center;
  height:44px;background:var(--surface);border-radius:26px 26px 0 0;
}
.sheethead .grab{width:38px;height:4px;border-radius:99px;background:var(--line);display:block;margin:0}
.xbtn{
  position:absolute;right:14px;top:8px;width:30px;height:30px;border-radius:50%;
  background:var(--line-soft);color:var(--ink-soft);font-size:13px;display:grid;place-items:center;
}
.xbtn:active{background:var(--line)}

/* ---------- 對話框 ---------- */
.mscrim{position:fixed;inset:0;background:rgba(48,44,41,.34);z-index:80;opacity:0;pointer-events:none;transition:opacity .18s}
.mscrim.on{opacity:1;pointer-events:auto}
.modal{
  position:fixed;left:50%;top:50%;transform:translate(-50%,-46%) scale(.97);
  width:calc(100% - 44px);max-width:340px;z-index:81;
  background:var(--surface);border-radius:22px;padding:18px;
  box-shadow:0 12px 44px rgba(62,57,54,.22);
  opacity:0;pointer-events:none;transition:opacity .18s,transform .18s;
}
.modal.on{opacity:1;pointer-events:auto;transform:translate(-50%,-50%) scale(1)}
.modal h3{margin:0 0 6px;font-size:16.5px;font-weight:650}
.modal p{margin:0 0 14px;font-size:13px;color:var(--ink-soft);line-height:1.6}
.modal .mrow{display:flex;gap:8px;margin-top:6px}
.modal .mrow button{flex:1;padding:11px;border-radius:14px;font-size:14.5px;font-weight:600}
.modal .mrow .no{background:var(--line-soft);color:var(--ink-soft)}
.modal .mrow .yes{background:var(--sage);color:#fff}
.modal .mrow .yes.danger{background:#B07868}

.toast{
  position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translate(-50%,14px);
  background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;font-size:13.5px;
  z-index:70;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;white-space:nowrap;
}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header><div class="wrap">
  <div class="brand"><h1>線盒</h1><span id="sub">DMC 繡線庫存</span></div>
  <div class="kinds" id="kinds" role="tablist"></div>
</div></header>

<main class="wrap" id="main"></main>

<nav><div class="wrap" id="nav"></div></nav>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet">
  <div class="sheethead"><span class="grab"></span><button class="xbtn" id="closeSheet" aria-label="關閉">✕</button></div>
  <div class="inner" id="sheetBody"></div>
</div>
<div class="mscrim" id="mscrim"></div>
<div class="modal" id="modal"><div id="modalBody"></div></div>

const Store = (() => {
  const KEY = 'thread-box-v1';
  let ok = true, mem = null;
  try { localStorage.setItem('__t', '1'); localStorage.removeItem('__t'); }
  catch (e) { ok = false; }
  return {
    persistent: ok,
    load() {
      try {
        const raw = ok ? localStorage.getItem(KEY) : mem;
        if (!raw) return null;
        const o = JSON.parse(raw);
        return (o && typeof o === 'object' && !Array.isArray(o)) ? o : null;
      } catch (e) { return null; }
    },
    save(obj) {
      const raw = JSON.stringify(obj);
      try { ok ? localStorage.setItem(KEY, raw) : (mem = raw); } catch (e) {}
    }
  };
})();

function palette() {
  if (kind === 'other') return db.custom;
  return DMC;

function sortedPalette() {
  const p = palette().slice();
  if (kind === 'other') return p;
  return p.sort((a, b) => {
    const na = parseInt(a.c, 10), nb = parseInt(b.c, 10);
    if (isNaN(na) && isNaN(nb)) return a.c.localeCompare(b.c);
    if (isNaN(na)) return -1;
    if (isNaN(nb)) return 1;
    return na - nb;
  });
}
function matches(x) {
  const r = rec(kind, x.c);
  if (famFilter && x.f !== famFilter) return false;
  if (stateFilter === 'have' && !(r && r.skeins > 0)) return false;
  if (stateFilter === 'low' && !(r && r.skeins > 0 && r.level === 'low')) return false;
  if (stateFilter === 'scrap' && !(r && r.scrap)) return false;
  if (stateFilter === 'none' && r && (r.skeins > 0 || r.scrap)) return false;
  if (stateFilter === 'wish' && !(r && r.wish)) return false;
  if (q) {
    const s = q.toLowerCase().trim();
    if (!(x.c.toLowerCase().includes(s) || (x.n || '').toLowerCase().includes(s)

}

function famOfHex(hex) {
  const hx = (hex || '#bfbfbf').replace('#', '');
  const r = parseInt(hx.slice(0, 2), 16) / 255,
        g = parseInt(hx.slice(2, 4), 16) / 255,
        b = parseInt(hx.slice(4, 6), 16) / 255;
  const mx = Math.max(r, g, b), mn = Math.min(r, g, b), l = (mx + mn) / 2, d = mx - mn;
  const sat = d === 0 ? 0 : d / (1 - Math.abs(2 * l - 1));
  if (sat < 0.10) return l < 0.80 ? '黑/灰' : '白/米';
  if (l > 0.90 && sat < 0.35) return '白/米';
  let h;
  if (d === 0) h = 0;
  else if (mx === r) h = 60 * (((g - b) / d) % 6);
  else if (mx === g) h = 60 * ((b - r) / d + 2);
  else h = 60 * ((r - g) / d + 4);
  if (h < 0) h += 360;
  if (h < 12 || h >= 345) return '紅';
  if (h < 40) return '橘';
  if (h < 68) return '黃';
  if (h < 160) return '綠';
  if (h < 255) return '藍';
  if (h < 290) return '紫';
  return '粉';
}

function findColor(k, c) {

}

function projStat(p) {
  let miss = 0, todo = 0;
  p.colors.forEach(it => {
    const r = rec(it.k, it.c);
    if (r && r.skeins > 0) return;
    miss++;
    if (!(r && r.wish)) todo++;
  });
  return { miss, todo };
}
function lumOf(x) {
  if (typeof x.l === 'number') return x.l;
  const hx = (x.h || '#bfbfbf').replace('#', '');
  const r = parseInt(hx.slice(0, 2), 16), g = parseInt(hx.slice(2, 4), 16), b = parseInt(hx.slice(4, 6), 16);
  return (0.2126 * r + 0.7152 * g + 0.0722 * b) / 255;
}
const levelLabel = l => (LEVELS.find(x => x[0] === l) || LEVELS[0])[1];

function shelfBody() {
  const list = sortedPalette().filter(matches);
  const kindObj = kindOf(kind);
  let h = `<div class="count"><span>${kindObj.full} · ${list.length} 色</span>
    ${kind === 'other' ? '<button id="addCustom">＋ 新增自訂線</button>' : ''}</div>`;

  if (!list.length) {
    h += kind === 'other' && !db.custom.length

      : `<div class="empty"><b>這個條件下沒有色號</b>換個色系或清掉搜尋字看看。</div>`;
  } else {
    h += '<div class="capgrid">' + list.map(x => {
      const r = rec(kind, x.c);
      const has = r && r.skeins > 0;
      const dark = lumOf(x) < 0.58;
      const tags = [];
      if (has && r.level === 'low') tags.push('<i class="low">快用完</i>');
      else if (has) tags.push(`<i>${levelLabel(r.level)}</i>`);
      if (r && r.scrap) tags.push('<i>殘線</i>');
      if (r && r.wish) tags.push('<i>待買</i>');
      if (!tags.length) tags.push('<i class="none">—</i>');
      return `<button class="cap" data-c="${esc(x.c)}" title="${esc(x.c)} ${esc(x.n || '')}"
        style="background:${FAMTINT[x.f] || '#EAE7E3'}">
        <span class="chip${has ? '' : ' zero'}"
          style="background:${esc(x.h)};color:${dark ? '#fff' : '#2C2825'}"><em>${has ? r.skeins : 0}</em></span>
        <span class="body">
          <b>${esc(x.c)}</b>
          <span class="tags">${tags.join('')}</span>
        </span>
      </button>`;
    }).join('') + '</div>';
  }
  return h;
}



// 挑色的結果區也獨立，理由同 shelfBody
function pickBody() {
  const p = proj(projOpen);
  if (!p) return '';
  const src = (pickKind === 'other' ? db.custom : DMC).filter(x => {
    if (pickFam && x.f !== pickFam) return false;
    if (pickQ) {
      const q2 = pickQ.toLowerCase().trim();
      if (!(x.c.toLowerCase().includes(q2) || (x.n || '').toLowerCase().includes(q2)
        || (x.b || '').toLowerCase().includes(q2))) return false;
    }
    return true;
  });
  const chosen = new Set(p.colors.map(it => it.k + ':' + it.c));
  return `<div class="count"><span>已選 ${p.colors.length} 色 · 這裡有 ${src.length} 色</span></div>`
    + (src.length ? `<div class="pickgrid">${src.map(x => {
        const on = chosen.has(pickKind + ':' + x.c);
        return `<button class="pick${on ? ' on' : ''}" data-pick="${esc(x.c)}"
          style="background:${esc(x.h)};color:${lumOf(x) < 0.58 ? '#fff' : '#2C2825'}">${esc(x.c)}</button>`;
      }).join('')}</div>` : `<div class="empty"><b>這個條件下沒有色號</b>換個色系試試。</div>`);
}

/* ---------- 畫面：作品配色 ---------- */
function renderProj() {
  if (!projOpen) {
    let h = `<div class="panel"><h2>作品配色</h2>
      <p>把想用的線挑進同一個作品，放在一起看整組配色順不順眼。缺哪幾色也會一併幫你標出來。</p>`;
    if (!db.projects.length) {
      h += `<div class="empty"><b>還沒有作品</b>先開一個，名字隨意，之後都能改。</div>`;
    } else {
      h += db.projects.map(p => {
        const sw = p.colors.slice(0, 4).map(it => `<span style="background:${esc(findColor(it.k, it.c).h)}"></span>`).join('');
        const st = projStat(p);
        return `<button class="projcard" data-proj="${esc(p.id)}">
          <span class="mini${sw ? '' : ' none'}">${sw}</span>
          <span class="txt"><b>${esc(p.name)}</b>
            <small>${p.colors.length} 色${st.miss ? ` · 缺 ${st.miss} 色` : p.colors.length ? ' · 都有貨' : ''}</small></span>
          <span class="go">›</span></button>`;
      }).join('');
    }
    h += `<button class="btn" id="newProj" style="margin-top:14px">＋ 新增作品</button></div>`;
    return h;
  }

  const p = proj(projOpen);
  if (!p) { projOpen = null; return renderProj(); }

  if (projPick) {
    return `<div class="crumb stick"><h2>挑顏色 · ${esc(p.name)}</h2>
      <button class="done" id="donePick">完成${p.colors.length ? `（${p.colors.length} 色）` : ''}</button></div>
    <div class="kinds" style="margin-top:0">${KINDS.map(k =>
      `<button data-pk="${k.id}" aria-selected="${pickKind === k.id}">${k.label}</button>`).join('')}</div>
    <div class="searchrow"><div class="search">
      <input id="pq" type="search" placeholder="找色號" value="${esc(pickQ)}"></div></div>
    <div class="chips">
      <button class="chip" data-pf="" aria-pressed="${!pickFam}">全色系</button>
      ${FAMS.map(f => `<button class="chip" data-pf="${esc(f[0])}" aria-pressed="${pickFam === f[0]}"><span class="dot" style="background:${f[1]}"></span>${f[0]}</button>`).join('')}
    </div>
    <div id="pickBody">${pickBody()}</div>`;
  }

  const st = projStat(p);
  let h = `<div class="crumb"><button data-proj="">‹ 作品</button><h2>${esc(p.name)}</h2>
    <span class="viewtog">
      <button data-pl="bar" aria-selected="${db.projLayout === 'bar'}">色條</button>
      <button data-pl="grid" aria-selected="${db.projLayout === 'grid'}">色塊</button>
    </span></div>
  <div class="ptools">
    <button class="main" id="pickColors">＋ 挑顏色</button>
    ${st.todo ? `<button class="wish" id="wishMissing">缺 ${st.todo} 色 · 加進待買</button>`
      : st.miss ? `<button class="wish" disabled>缺 ${st.miss} 色 · 已在待買</button>` : ''}
    <button id="renameProj">改名</button>
    <button class="danger" id="delProj">刪除此作品</button>
  </div>`;

  if (!p.colors.length) {
    h += `<div class="empty"><b>還沒挑任何顏色</b>按下面的按鈕，依色系一次看完一整排。</div>`;
  } else {
    h += `<p class="tipline">長壓色票可以拖曳排序；點一下則是從作品移除。</p>`;
    const cells = p.colors.map(it => {
      const x = findColor(it.k, it.c);
      const r = rec(it.k, it.c);
      const dark = lumOf(x) < 0.58;
      const tag = (r && r.skeins > 0) ? '' : '<span class="miss">缺</span>';
      return { x, dark, tag, it };
    });
    h += db.projLayout === 'bar'
      ? cells.map((o, i) => `<button class="pbar" data-idx="${i}" data-drop="${esc(o.it.k)}|${esc(o.it.c)}"
          style="background:${esc(o.x.h)};color:${o.dark ? '#fff' : '#2C2825'}">
          <b>${esc(o.x.c)}</b>${o.tag}</button>`).join('')
      : `<div class="pgrid">${cells.map((o, i) => `<button class="pcell" data-idx="${i}" data-drop="${esc(o.it.k)}|${esc(o.it.c)}"
          style="background:${esc(o.x.h)};color:${o.dark ? '#fff' : '#2C2825'}">
          ${o.tag}<b>${esc(o.x.c)}</b></button>`).join('')}</div>`;
  }

  return h;
}

/* ---------- 畫面：待買清單 ---------- */
function renderWish() {
  const list = wishList();
  let h = `<div class="panel"><h2>待買清單</h2>
    <p>買回來之後，先調整每一色要入幾束，再按「入庫」；或一次按最下面的「全部入庫」。</p>`;
  if (!list.length) {
    h += `<div class="empty"><b>清單是空的</b>逛店前先來這裡看一眼，就不會又買到重複的線了。</div></div>`;
    return h;
  }
  h += list.map(it => {
    const id = it.k + ':' + it.col.c;
    const n = buyQty[id] || 1;
    return `<div class="row">
      <div class="patch" style="background:${esc(it.col.h)}"></div>
      <div class="txt"><b>${esc(it.col.c)}</b>
        <small>${esc([kindOf(it.k).label, it.col.b, it.col.n].filter(Boolean).join(' · '))}</small></div>
      <div class="qty">
        <button data-bq="${esc(id)}|-1" aria-label="少一束">−</button>
        <span>${n}</span>
        <button data-bq="${esc(id)}|1" aria-label="多一束">＋</button>
      </div>
      <button class="act" data-bought="${esc(it.k)}|${esc(it.col.c)}">入庫</button>
    </div>`;
  }).join('');
  h += `<button class="btn" id="buyAll" style="margin-top:16px">全部入庫（${list.length} 色）</button>
    <button class="btn ghost" id="clearWish">清空整張清單</button></div>`;
  return h;
}

/* ---------- 畫面：備份與統計 ---------- */
function renderBackup() {
  const all = Object.values(db.stock);
  const owned = all.filter(x => x.skeins > 0);
  const skeins = owned.reduce((s, x) => s + x.skeins, 0);
  const low = owned.filter(x => x.level === 'low').length;
  const scrap = all.filter(x => x.scrap).length;

  return `
  <div class="panel"><h2>我的線況</h2>
    <div class="row"><div class="txt"><b>${owned.length} 色</b><small>目前手上有的顏色</small></div></div>
    <div class="row"><div class="txt"><b>${skeins} 束</b><small>全部加起來的束數</small></div></div>
    <div class="row"><div class="txt"><b>${low} 色</b><small>標記為快用完</small></div></div>
    <div class="row"><div class="txt"><b>${scrap} 色</b><small>有殘線可以先用</small></div></div>
    <div class="row"><div class="txt"><b>${wishList().length} 色</b><small>在待買清單裡</small></div></div>
  </div>

  <div class="panel"><h2>備份</h2>
    <p>資料存在這支手機的瀏覽器裡。換手機、或清掉 Safari 資料之前，先按下面的按鈕複製一份，貼到備忘錄就安全了。</p>
    <button class="btn" id="doExport">複製備份文字</button>
    <textarea id="ioBox" placeholder="備份文字會出現在這裡；要還原就把之前存的文字貼進來，再按下面的還原。"></textarea>
    <button class="btn ghost" id="doImport">從上面的文字還原</button>
  </div>

  <div class="panel"><h2>全部清除</h2>
    <p>會刪掉所有庫存、待買與自訂線材，而且無法復原。記得先備份。</p>
    <button class="btn warn" id="doReset">清除所有資料</button>
  </div>

  ${Store.persistent ? '' : `<div class="panel"><h2>提醒</h2><p>目前這個環境不支援本機儲存，關掉頁面資料就會消失。把這個檔案放到你自己的網址上打開，就能正常存檔了。</p></div>`}`;
}

/* ---------- 詳細面板 ---------- */
function openSheet(code) {
  const src = kind === 'other' ? db.custom : DMC;
  const x = src.find(i => i.c === code);
  if (!x) return;
  openKey = code;
  const r = rec(kind, code) || { skeins: 0, level: 'full', wish: false, scrap: false, note: '' };

  document.getElementById('sheetBody').innerHTML = `
    <div class="hero">
      <div class="patch" style="background:${esc(x.h)}"></div>
      <div class="t"><b>${esc(x.c)}</b><small>${esc([x.b, x.n].filter(Boolean).join(' · ') || '自訂線材')}</small>
      <em>${esc(kindOf(kind).full)}${x.f ? ' · ' + esc(x.f) : ''}</em></div>
    </div>

    <div class="block"><div class="lab">有幾束</div>
      <div class="stepper">
        <button data-step="-1" aria-label="減一束">−</button>
        <div class="n" id="nSk">${r.skeins}<span>束</span></div>
        <button data-step="1" aria-label="加一束">＋</button>
      </div>
    </div>

    <div class="block"><div class="lab">剩下大概多少</div>
      <div class="seg">${LEVELS.map(l => `<button data-lv="${l[0]}" aria-pressed="${r.level === l[0]}">${l[1]}</button>`).join('')}</div>
    </div>

    <div class="block"><div class="lab">標記（不影響上面的束數）</div>
      <div class="toggles">
        <button data-tg="scrap" class="scrap" aria-pressed="${!!r.scrap}"><b>有殘線</b><small>零頭還能用</small></button>
        <button class="wish" data-tg="wish" aria-pressed="${!!r.wish}"><b>${r.wish ? '已在待買' : '加入待買'}</b><small>下次補貨</small></button>
      </div>
    </div>

    <div class="block"><div class="lab">備註</div>
      <textarea class="note" id="noteBox" placeholder="例如：8m 一束、放在第二層鐵盒、留給聖誕圖">${esc(r.note)}</textarea>
    </div>

    ${kind === 'other' ? '<button class="btn ghost" id="editCustom">編輯這個自訂線</button><button class="btn warn" id="delCustom">刪掉這個自訂線</button>' : ''}
    <button class="btn ghost" id="closeSheetBottom">收起來</button>`;

  document.getElementById('scrim').classList.add('on');
  document.getElementById('sheet').classList.add('on');
}
function closeSheet() {
  const nb = document.getElementById('noteBox');
  if (nb && openKey !== null) setRec(kind, openKey, { note: nb.value });
  document.getElementById('scrim').classList.remove('on');
  document.getElementById('sheet').classList.remove('on');
  openKey = null;
  render();
}

/* ---------- 主渲染 ---------- */
function render() {
  const kindsEl = document.getElementById('kinds');
  kindsEl.style.display = view === 'shelf' ? 'flex' : 'none';
  kindsEl.innerHTML = KINDS.map(k =>
    `<button role="tab" data-kind="${k.id}" aria-selected="${kind === k.id}">${k.label}</button>`).join('');

  const wn = wishList().length;
  const icons = {
    shelf: '<path d="M4 5h16v14H4z"/><path d="M4 10h16M10 5v14"/>',
    proj: '<path d="M12 4a8 8 0 1 0 0 16c1.1 0 1.6-.8 1.6-1.5 0-1.4 1-1.9 2.2-1.9H18a3 3 0 0 0 3-3 8 8 0 0 0-9-9.6z"/><circle cx="8.5" cy="11" r=".9"/><circle cx="12" cy="8" r=".9"/><circle cx="15.6" cy="11" r=".9"/>',
    wish: '<path d="M6 7h13l-1.5 8H7.5z"/><circle cx="9" cy="19" r="1.2"/><circle cx="17" cy="19" r="1.2"/><path d="M3 4h2l1 3"/>',
    backup: '<path d="M12 4v10"/><path d="M8 10l4 4 4-4"/><path d="M4 17v2h16v-2"/>'
  };
  const tabs = [['shelf', '色卡'], ['proj', '作品'], ['wish', '待買'], ['backup', '備份']];
  document.getElementById('nav').innerHTML = tabs.map(t =>
    `<button data-view="${t[0]}" aria-selected="${view === t[0]}">
      <svg viewBox="0 0 24 24">${icons[t[0]]}</svg>${t[1]}
      ${t[0] === 'wish' && wn ? `<span class="badge">${wn}</span>` : ''}
    </button>`).join('');

  document.getElementById('sub').textContent =
    view === 'shelf' ? 'DMC 繡線庫存' : view === 'proj' ? '作品配色' : view === 'wish' ? '下次要補的線' : '統計與備份';

  const m = document.getElementById('main');
  m.innerHTML = view === 'shelf' ? renderShelf()
    : view === 'proj' ? renderProj()
    : view === 'wish' ? renderWish() : renderBackup();
}

/* ---------- 事件 ---------- */
document.addEventListener('click', e => {
  if (Date.now() - lastDragEnd < 450) return;   // 忽略拖曳結束後的那次點擊
  const t = e.target;
  const hit = s => t.closest(s);

  // --- 對話框 ---
  const mb = hit('[data-m]');
  if (mb) {
    if (mb.dataset.m === 'ok') { const cb = modalCb; hideModal(); if (cb) cb(); }
    else hideModal();
    return;
  }
  if (t.id === 'mscrim') return hideModal();

  const kb = hit('[data-kind]');
  if (kb) { kind = kb.dataset.kind; stateFilter = 'all'; famFilter = null; return render(); }

  const vb = hit('[data-view]');
  if (vb) { view = vb.dataset.view; return render(); }

  // --- 作品配色 ---
  const pc = hit('[data-proj]');
  if (pc) { projOpen = pc.dataset.proj || null; projPick = false; return render(); }
  const pl = hit('[data-pl]');
  if (pl) { db.projLayout = pl.dataset.pl; save(); return render(); }
  const pk = hit('[data-pk]');
  if (pk) { pickKind = pk.dataset.pk; pickFam = null; return render(); }
  const pf = hit('[data-pf]');
  if (pf) { pickFam = pf.dataset.pf || null; return render(); }
  if (hit('#newProj')) {
    askText('新增作品', '之後隨時可以改名字。', '例如：聖誕小屋、媽媽的桌巾', '', '建立', name => {
      if (!name) return;
      const id = 'p' + Date.now().toString(36);
      db.projects.push({ id, name, colors: [] });
      save(); projOpen = id; projPick = true; render();
    });
    return;
  }
  if (hit('#pickColors')) { projPick = true; pickQ = ''; return render(); }
  if (hit('#donePick')) { projPick = false; return render(); }
  const pick = hit('[data-pick]');
  if (pick && projOpen) {
    const p = proj(projOpen), c = pick.dataset.pick;
    const i = p.colors.findIndex(o => o.k === pickKind && o.c === c);
    if (i >= 0) p.colors.splice(i, 1); else p.colors.push({ k: pickKind, c });
    save(); return render();
  }
  const drop = hit('[data-drop]');
  if (drop && projOpen) {
    const [k, c] = drop.dataset.drop.split('|');
    askConfirm('從作品移除？', `${esc(c)} 會從這個作品的配色中拿掉，庫存紀錄不受影響。`, '移除', true, () => {
      const p = proj(projOpen);
      p.colors = p.colors.filter(o => !(o.k === k && o.c === c));
      save(); render();
    });
    return;
  }
  if (hit('#renameProj') && projOpen) {
    const p = proj(projOpen);
    askText('改名字', '', '作品名稱', p.name, '儲存', name => {
      if (name) { p.name = name; save(); render(); }
    });
    return;
  }
  if (hit('#delProj') && projOpen) {
    const p = proj(projOpen);
    askConfirm('刪掉這個作品？', `「${esc(p.name)}」的配色會消失，庫存和待買清單不受影響。`, '刪掉', true, () => {
      db.projects = db.projects.filter(o => o.id !== projOpen);
      save(); projOpen = null; render();
    });
    return;
  }
  if (hit('#wishMissing') && projOpen) {
    const p = proj(projOpen);
    let n = 0;
    p.colors.forEach(it => {
      const r = rec(it.k, it.c);
      if (r && r.skeins > 0) return;
      setRec(it.k, it.c, { wish: true }); n++;
    });
    toast('已加入 ' + n + ' 色到待買清單'); return render();
  }

  const sw = hit('.cap');
  if (sw) return openSheet(sw.dataset.c);

  const st = hit('[data-st]');
  if (st) { stateFilter = st.dataset.st; return render(); }

  const fm = hit('[data-fam]');
  if (fm) { famFilter = fm.dataset.fam || null; return render(); }

  if (hit('#qclr')) { q = ''; return render(); }

  // 詳細面板
  const step = hit('[data-step]');
  if (step && openKey !== null) {
    const r = rec(kind, openKey) || { skeins: 0 };
    const n = Math.max(0, (r.skeins || 0) + Number(step.dataset.step));
    setRec(kind, openKey, { skeins: n });
    document.getElementById('nSk').innerHTML = n + '<span>束</span>';
    return;
  }
  const lv = hit('[data-lv]');
  if (lv && openKey !== null) {
    setRec(kind, openKey, { level: lv.dataset.lv });
    lv.parentElement.querySelectorAll('button').forEach(b =>
      b.setAttribute('aria-pressed', b === lv));
    return;
  }
  const tg = hit('[data-tg]');
  if (tg && openKey !== null) {
    const f = tg.dataset.tg;
    const cur = (rec(kind, openKey) || {})[f];
    setRec(kind, openKey, { [f]: !cur });
    tg.setAttribute('aria-pressed', String(!cur));
    if (f === 'wish') {
      tg.querySelector('b').textContent = !cur ? '已在待買' : '加入待買';
      toast(!cur ? '已加入待買清單' : '已從待買清單移除');
    }
    if (f === 'scrap') toast(!cur ? '已標記有殘線' : '已取消殘線標記');
    return;
  }
  if (hit('#closeSheet, #closeSheetBottom') || t.id === 'scrim') return closeSheet();
  if (hit('#delCustom') && openKey !== null) {
    const k0 = openKey;
    askConfirm('刪掉這個自訂線？', `${esc(k0)} 的庫存紀錄也會一起消失。`, '刪掉', true, () => {
      db.custom = db.custom.filter(x => x.c !== k0);
      delete db.stock[key('other', k0)];
      save(); openKey = null;
      document.getElementById('scrim').classList.remove('on');
      document.getElementById('sheet').classList.remove('on');
      render();
    });
    return;
  }

  // 待買
  const bq = hit('[data-bq]');
  if (bq) {
    const parts = bq.dataset.bq.split('|');
    const id = parts[0], d = Number(parts[1]);
    buyQty[id] = Math.max(1, (buyQty[id] || 1) + d);
    return render();
  }
  const bought = hit('[data-bought]');
  if (bought) {
    const [k, c] = bought.dataset.bought.split('|');
    const id = k + ':' + c;
    const n = buyQty[id] || 1;
    const r = db.stock[id] || { skeins: 0 };
    db.stock[id] = { ...r, wish: false, skeins: (r.skeins || 0) + n, level: 'full' };
    delete buyQty[id];
    save(); toast(c + ' 入庫 ' + n + ' 束'); return render();
  }
  if (hit('#buyAll')) {
    const list = wishList();
    if (!list.length) return;
    const lines = list.map(it => {
      const id = it.k + ':' + it.col.c;
      return `<b>${esc(it.col.c)}</b> × ${buyQty[id] || 1} 束`;
    }).join('<br>');
    showModal(`<h3>全部入庫</h3><p>確認照下面的數量加進庫存，並從待買清單移除：</p>
      <div class="buylist">${lines}</div>
      <div class="mrow"><button class="no" data-m="no">再看看</button>
      <button class="yes" data-m="ok">確定入庫</button></div>`, () => {
      let total = 0;
      list.forEach(it => {
        const id = it.k + ':' + it.col.c;
        const n = buyQty[id] || 1;
        const r = db.stock[id] || { skeins: 0 };
        db.stock[id] = { ...r, wish: false, skeins: (r.skeins || 0) + n, level: 'full' };
        delete buyQty[id];
        total += n;
      });
      save(); toast('已入庫 ' + total + ' 束'); render();
    });
    return;
  }
  if (hit('#clearWish')) {
    askConfirm('清空待買清單？', '清單上的色號會全部移除，庫存不受影響。', '清空', true, () => {
      Object.keys(db.stock).forEach(id => { if (db.stock[id].wish) db.stock[id] = { ...db.stock[id], wish: false }; });
      Object.keys(db.stock).forEach(id => {
        const v = db.stock[id];
        if (!v.skeins && !v.wish && !v.scrap && !v.note) delete db.stock[id];
      });
      save(); render();
    });
    return;
  }

  // 自訂線
  if (hit('#addCustom')) return customForm(null);
  if (hit('#editCustom') && openKey !== null) return customForm(db.custom.find(x => x.c === openKey));

  // 備份
  if (hit('#doExport')) {
    const txt = JSON.stringify(db);
    document.getElementById('ioBox').value = txt;
    navigator.clipboard && navigator.clipboard.writeText(txt)
      .then(() => toast('已複製，快去貼到備忘錄'))
      .catch(() => toast('請長按上方文字手動複製'));
    return;
  }
  if (hit('#doImport')) {
    const raw = document.getElementById('ioBox').value.trim();
    if (!raw) return toast('請先把備份文字貼進框裡');
    try {
      const o = JSON.parse(raw);
      if (!o || typeof o.stock !== 'object') throw 0;
      askConfirm('還原備份？', '目前的庫存、作品與待買清單都會被這份備份取代。', '還原', false, () => {
        db = { stock: o.stock || {}, custom: o.custom || [], projects: o.projects || [], projLayout: o.projLayout || 'bar', v: 1 };
        save(); toast('還原完成'); render();
      });
      return;
    } catch (err) { return toast('這段文字看起來不是備份檔'); }
  }
  if (hit('#doReset')) {
    askConfirm('清除所有資料？', '庫存、作品、待買、自訂線材全部會刪掉，而且無法復原。', '清除', true, () => {
      db = { stock: {}, custom: [], projects: [], projLayout: 'bar', v: 1 };
      save(); toast('已全部清除'); render();
    });
    return;
  }
});

document.addEventListener('input', e => {
  if (e.target.id === 'q') {
    q = e.target.value;
    const el = document.getElementById('shelfBody');
    if (el) el.innerHTML = shelfBody(); else render();
  }
  if (e.target.id === 'pq') {
    pickQ = e.target.value;
    const el = document.getElementById('pickBody');
    if (el) el.innerHTML = pickBody(); else render();
  }
});

/* ---------- 長壓拖曳排序 ---------- */
let dragS = null, lastDragEnd = 0;

function pointOf(e) { return e.touches && e.touches[0] ? e.touches[0] : e; }

function dragStart(e) {
  if (!projOpen || projPick || view !== 'proj') return;
  const sw = e.target.closest && e.target.closest('[data-idx]');
  if (!sw) return;
  const pt = pointOf(e);
  dragS = { el: sw, x: pt.clientX, y: pt.clientY, on: false, timer: null };
  dragS.timer = setTimeout(() => {
    if (!dragS) return;
    dragS.on = true;
    document.body.classList.add('dragmode');
    dragS.el.classList.add('dragging');
    if (navigator.vibrate) navigator.vibrate(12);
  }, 420);
}

// 拖曳時直接搬移 DOM，不重畫整頁，手指按住的元素才不會被銷毀
function syncOrder(container) {
  const nodes = Array.prototype.slice.call(container.querySelectorAll('[data-drop]'));
  const p = proj(projOpen);
  if (!p) return;
  p.colors = nodes.map(n => {
    const parts = n.dataset.drop.split('|');
    return { k: parts[0], c: parts[1] };
  });
  nodes.forEach((n, i) => n.setAttribute('data-idx', String(i)));
}

function dragMove(e) {
  if (!dragS) return;
  const pt = pointOf(e);
  if (!dragS.on) {
    if (Math.hypot(pt.clientX - dragS.x, pt.clientY - dragS.y) > 10) {
      clearTimeout(dragS.timer); dragS = null;
    }
    return;
  }
  e.preventDefault();
  const under = document.elementFromPoint(pt.clientX, pt.clientY);
  const tgt = under && under.closest && under.closest('[data-idx]');
  if (!tgt || tgt === dragS.el) return;
  const container = dragS.el.parentElement;
  if (!container || tgt.parentElement !== container) return;
  const before = tgt.compareDocumentPosition(dragS.el) & Node.DOCUMENT_POSITION_FOLLOWING;
  container.insertBefore(dragS.el, before ? tgt : tgt.nextSibling);
  syncOrder(container);
}

function dragEnd() {
  if (!dragS) return;
  clearTimeout(dragS.timer);
  const moved = dragS.on;
  if (moved) {
    dragS.el.classList.remove('dragging');
    document.body.classList.remove('dragmode');
    lastDragEnd = Date.now();
    save();
    toast('順序已更新');
  }
  dragS = null;
  if (moved) render();   // 只有真的拖過才重畫
}
document.addEventListener('touchstart', dragStart, { passive: true });
document.addEventListener('touchmove', dragMove, { passive: false });
document.addEventListener('touchend', dragEnd);
document.addEventListener('touchcancel', dragEnd);
document.addEventListener('mousedown', dragStart);
document.addEventListener('mousemove', dragMove);
document.addEventListener('mouseup', dragEnd);

render();

</script>
